<!DOCTYPE html>
<html lang="en">
<head>
<!-- PROV:BEGIN -->
<!-- keel: served-page | provenance: stamped by stamp_provenance.py (site-wide AI-readiness marker; the per-page facts live in the page body + the machine corpus at /llms-full.txt) -->
<!-- PROV:END -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search the gifts — loopmmt.com</title>
  <meta name="description" content="Search the Loop MMT gifts — one honest rank over all 95 single-file gifts, with port-verb facet chips (source · transform · filter · fold · sink) that narrow to the classified set. Rank is computed at query time; the facet filters, it does not rank.">
  <link rel="canonical" href="https://loopmmt.com/gifts/search/">
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/design/shell.css">
  <link rel="stylesheet" href="/design/loop-search.css">
  <style>
    /* The port-verb facet chip bar. Small, self-scoped; the rest is design-system chrome.
       No color carries meaning alone — the active chip also reads aria-pressed=true. */
    .gifts-facets { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1rem; padding: 0; }
    .gifts-facets__chip {
      font: inherit; cursor: pointer; border: 1px solid var(--rule, #cbb); border-radius: 999px;
      padding: .3rem .8rem; background: transparent; color: inherit; line-height: 1.2;
    }
    .gifts-facets__chip[aria-pressed="true"] {
      background: var(--ink, #2b2b2b); color: var(--paper, #f7f2e8); border-color: var(--ink, #2b2b2b);
    }
    .gifts-facets__count { opacity: .65; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="frame">
    <main id="main">
      <h1>Search the gifts</h1>
      <p class="lede">One honest rank over all 95 single-file gifts. An empty query browses the catalog; a query ranks it. The port-verb chips below narrow to the gifts already classified by their place in a pipeline — <em>source, transform, filter, fold, sink</em> — while text search always covers every gift.</p>

      <!-- The facet chip bar. Chips are built at boot FROM the index's declared order
           (contract.facet.port_verb.order) — one oracle, no hardcoded copy. -->
      <div id="gifts-facets" class="gifts-facets" role="group" aria-label="Filter gifts by pipeline port-verb"></div>

      <!-- The reused corpus-search panel mounts here (same adapter as the site search door). -->
      <div id="loop-search" class="loop-search"></div>

      <noscript><p>Gift search needs JavaScript. The gifts themselves are static pages — browse them at <a href="/gifts/">/gifts/</a>.</p></noscript>
    </main>
  </div>

  <!-- The four shared-core search scripts, in dependency order, plus the SR-2 facet block.
       federationCore -> corpusSearch (createSiteSearch) -> corpusDisplay -> corpusPanel.
       Single source for the four: forest/app/public/shell/*.js; the deploy script-bridge copies
       them next to this page at serve time (no committed duplicate — deploy.sh "gifts-search
       slot"). gifts-search-facet.js is this page's own committed sibling and serves natively. -->
  <script src="./federation-core.js"></script>
  <script src="./corpus-search-federation.js"></script>
  <script src="./corpus-search-display.js"></script>
  <script src="./corpus-search-panel.js"></script>
  <script src="./gifts-search-facet.js"></script>

  <!-- boot: fetch the gifts index -> build chips from its declared order -> mount the reused
       ranked panel over the (facet-filtered) index. A chip toggle rebuilds the site over the
       filtered node set and re-mounts, preserving the current query. The adapter ranks
       unchanged; the facet only narrows the node set (score-honesty: no static score column).
       Client-side only; loopmmt.com is static GitHub Pages (no query server). -->
  <script>
  (function () {
    var LS = window.LoopSearch;
    var FACET = window.GiftsSearchFacet;
    var facetsEl = document.getElementById("gifts-facets");
    var mountEl = document.getElementById("loop-search");

    function fail(msg, err) {
      mountEl.textContent = msg;
      if (window.console && err) console.error("gifts-search boot failed:", err);
    }
    if (!LS || !LS.corpusSearch || !LS.corpusPanel || !LS.federationCore || !FACET) {
      return fail("Gift search is unavailable right now.");
    }

    fetch("/gifts-search-index.json")
      .then(function (r) { return r.json(); })
      .then(function (index) {
        var order = FACET.facetOrder(index);          // [source, transform, filter, fold, sink]
        var counts = FACET.facetCounts(index);
        var active = FACET.ALL;                        // no chip -> all 95 gifts text-searchable
        var handle = null;

        // (Re)mount the reused panel over the index filtered to the active facet, keeping the query.
        function remount() {
          var prevQuery = (handle && handle._input) ? handle._input.value : "";
          if (handle && handle.destroy) handle.destroy();
          var filtered = FACET.filterByPortVerb(index, active);
          var site = LS.corpusSearch.createSiteSearch(LS.federationCore, filtered);
          handle = LS.corpusPanel.mount(mountEl, site, { query: prevQuery });
        }

        function paintChips() {
          Array.prototype.forEach.call(facetsEl.querySelectorAll(".gifts-facets__chip"), function (btn) {
            var v = btn.getAttribute("data-verb");
            var isActive = (v === "__all__") ? (active === FACET.ALL) : (active === v);
            btn.setAttribute("aria-pressed", isActive ? "true" : "false");
          });
        }

        function makeChip(verb, label, count) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "gifts-facets__chip";
          btn.setAttribute("data-verb", verb);
          btn.innerHTML = label + ' <span class="gifts-facets__count">' + count + "</span>";
          btn.addEventListener("click", function () {
            active = (verb === "__all__") ? FACET.ALL : verb;
            paintChips();
            remount();
          });
          return btn;
        }

        // "All" chip first (the default), then one chip per declared verb, labeled with its count.
        facetsEl.appendChild(makeChip("__all__", "All gifts", counts._all));
        order.forEach(function (v) { facetsEl.appendChild(makeChip(v, v, counts[v] || 0)); });

        paintChips();
        remount();
      })
      .catch(function (e) { fail("Gift search is unavailable right now.", e); });
  })();
  </script>
</body>
</html>
