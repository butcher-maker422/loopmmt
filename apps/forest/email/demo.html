<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>email-app — one mailbox, searchable</title>
<!--
  email-app leg-1 reader. A two-pane reader over the tested mail-model (mail-model.js). On the box
  it performs the OWNER-DATA READ — GET /export/soil (owner-gated, content-bearing; the superset of
  the K1-stripped /projection/soil) — and renders the operator's real migrated mail via the same
  model path the test exercises (mailboxFromExport). Opened offline / with no owner session it 401s
  or fails and falls back to a CLEARLY-LABELLED SAMPLE fixture (Real-or-Made Line: sample is never
  dressed as real mail; the live path never wears the sample flag). Design INHERITED from the Forest
  skin. NOTE: the witnessed live read against the box is an operator-side go-live step.
-->
<style>
  :root{
    /* Grove-at-dawn — inherited from the Forest skin, not reinvented. */
    --paper:#f3efe6; --paper-2:#ece5d7; --ink:#2c2a24; --ink-soft:#6b6455;
    --line:#d8cfbd; --brass:#b5842b; --brass-deep:#8a6420; --moss:#5c6e4f;
    --sel:#e7ddc7; --shadow:rgba(44,42,36,.10);
    --display:'Fraunces',Georgia,'Times New Roman',serif;
    --body:'Spectral',Georgia,serif;
    --mono:'Spline Sans Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--body);
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .masthead{
    padding:20px 26px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .masthead h1{
    font-family:var(--display); font-weight:600; font-size:26px; letter-spacing:-.01em;
    margin:0; color:var(--ink);
  }
  .masthead h1 .amp{color:var(--brass)}
  .masthead .sub{font-family:var(--mono); font-size:12px; color:var(--ink-soft); letter-spacing:.02em}
  .sample-flag{
    margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--brass-deep);
    border:1px solid var(--brass); border-radius:2px; padding:3px 8px; background:#faf4e6;
  }
  .live-flag{ color:var(--moss); border-color:var(--moss); background:#eef1e9 }
  .live-flag[hidden],.sample-flag[hidden]{ display:none }
  .app{display:grid; grid-template-columns:minmax(300px,380px) 1fr; height:calc(100% - 74px)}
  .list-col{border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
  .search{padding:14px 16px; border-bottom:1px solid var(--line); background:var(--paper-2)}
  .search input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:3px;
    font-family:var(--body); font-size:15px; background:#fff; color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass)}
  .count{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-top:8px}
  .list{overflow-y:auto; min-height:0; flex:1}
  .row{
    padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer;
    display:block; width:100%; text-align:left; background:none; border-left:3px solid transparent;
    font-family:var(--body);
  }
  .row:hover{background:var(--paper-2)}
  .row.active{background:var(--sel); border-left-color:var(--brass)}
  .row:focus-visible{outline:2px solid var(--brass); outline-offset:-2px}
  .row .r-subject{font-weight:600; color:var(--ink); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .r-meta{display:flex; justify-content:space-between; gap:10px; margin-top:3px}
  .row .r-from{font-size:13px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .r-when{font-family:var(--mono); font-size:11px; color:var(--brass-deep); flex:none}
  .row .r-cat{font-family:var(--mono); font-size:10px; color:var(--moss); text-transform:lowercase; margin-top:4px; display:inline-block}
  .reader{padding:28px 34px; overflow-y:auto; min-height:0}
  .reader .empty{color:var(--ink-soft); font-style:italic; margin-top:40px}
  .reader h2{font-family:var(--display); font-weight:600; font-size:23px; margin:0 0 10px; letter-spacing:-.01em}
  .reader .headers{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:20px}
  .reader .headers b{color:var(--ink); font-weight:600}
  .reader .body{white-space:pre-wrap; font-size:16px; line-height:1.62; color:var(--ink); max-width:66ch}
  @media (max-width:720px){
    .app{grid-template-columns:1fr; grid-template-rows:1fr 1fr}
    .list-col{border-right:none; border-bottom:1px solid var(--line)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <header class="masthead">
    <h1>your mailbox <span class="amp">&amp;</span> search</h1>
    <span class="sub">email-app · one mailbox, searchable</span>
    <span class="sample-flag" id="sampleFlag">SAMPLE DATA — not your real mail</span>
    <span class="sample-flag live-flag" id="liveFlag" hidden>LIVE — your mail (read from the Soil)</span>
  </header>
  <div class="app">
    <section class="list-col">
      <div class="search">
        <input id="q" type="search" placeholder="Search subject, sender, or body…" aria-label="Search your mail" autocomplete="off">
        <div class="count" id="count"></div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Messages"></div>
    </section>
    <section class="reader" id="reader">
      <p class="empty">Select a message to read it.</p>
    </section>
  </div>

  <!-- the tested model, single source (forest/app/email/mail-model.js) -->
  <script src="mail-model.js"></script>
  <script>
  (function(){
    var MM = window.EmailApp.mailModel;

    // SAMPLE fixture — rows in the exact Soil shape the Catch stores (content = the adapter block).
    // Obvious sample content; wired to the live Soil this array is replaced by the owner-data read.
    function blk(s,f,d,b){ return 'Subject: '+s+'\nFrom: '+f+'\nDate: '+d+'\n\n'+b; }
    var rows = [
      {item_id:'s1', category:'demo', source:'gmail', ingested_at:'2026-07-01T14:00:00Z',
       content:blk('[sample] Field permit for the Grove clearing','town.clerk@example.test','Wed, 01 Jul 2026 09:12:00 -0400',
       'This is sample mail for the email-app demo. The permit is approved; pick up the paperwork at the office.\n\n— sample sender')},
      {item_id:'s2', category:'demo', source:'gmail', ingested_at:'2026-06-28T20:00:00Z',
       content:blk('[sample] Summer league — Saturday roster','league@example.test','Sat, 28 Jun 2026 16:40:00 -0400',
       'Sample content. You are handling this week. First pull at 9am, fields open at 8:30. Bring the light and dark sets.')},
      {item_id:'s3', category:'demo', source:'gmail', ingested_at:'2026-06-20T11:00:00Z',
       content:blk('[sample] Your lumber order is ready','store@example.test','Fri, 20 Jun 2026 08:05:00 -0400',
       'Sample content only. Two bundles of cedar and the deck screws are on the dock under your name.')},
      {item_id:'s4', category:'demo', source:'gmail', ingested_at:'2026-06-15T09:00:00Z',
       content:blk('[sample] Re: the RV solar quote','installer@example.test','Sun, 15 Jun 2026 19:22:00 -0400',
       'Sample thread. The revised quote drops the second panel; total comes in under the number we discussed.')},
      {item_id:'s5', category:'demo', source:'gmail', ingested_at:'2026-06-10T09:00:00Z',
       content:blk('[sample] chicken feed subscription','farmsupply@example.test','Tue, 10 Jun 2026 07:00:00 -0400',
       'Sample content. Your monthly layer feed ships Thursday. Five hens, one order — reply STOP to pause.')},
      {item_id:'s6', content:'a malformed sample row with no header block — the reader degrades honestly, showing the raw text as body', name:'[sample] malformed row', category:'demo', source:'gmail'}
    ];

    var mailbox = MM.buildMailbox(rows);
    var listEl = document.getElementById('list');
    var readerEl = document.getElementById('reader');
    var countEl = document.getElementById('count');
    var qEl = document.getElementById('q');
    var activeId = null;

    function relWhen(m){
      if(!m.date && !m.ingestedAt) return '';
      var t = Date.parse(m.date) || Date.parse(m.ingestedAt);
      if(isNaN(t)) return '';
      var days = Math.floor((Date.now()-t)/86400000);
      if(days<=0) return 'today'; if(days===1) return 'yesterday';
      if(days<30) return days+'d ago';
      return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    }
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

    function renderList(msgs){
      countEl.textContent = msgs.length + (msgs.length===1?' message':' messages');
      listEl.innerHTML = '';
      if(!msgs.length){
        var e=document.createElement('div'); e.className='row'; e.style.cursor='default';
        e.innerHTML='<span class="r-from">No messages match that search.</span>';
        listEl.appendChild(e); return;
      }
      msgs.forEach(function(m){
        var b=document.createElement('button');
        b.className='row'+(m.id===activeId?' active':''); b.setAttribute('role','option');
        b.setAttribute('aria-selected', m.id===activeId?'true':'false');
        b.innerHTML =
          '<span class="r-subject">'+esc(m.subject)+'</span>'+
          '<span class="r-meta"><span class="r-from">'+esc(m.from||'—')+'</span>'+
          '<span class="r-when">'+esc(relWhen(m))+'</span></span>'+
          (m.category?'<span class="r-cat">'+esc(m.category)+'</span>':'');
        b.addEventListener('click', function(){ activeId=m.id; renderList(msgs); renderReader(m); });
        listEl.appendChild(b);
      });
    }
    function renderReader(m){
      readerEl.innerHTML =
        '<h2>'+esc(m.subject)+'</h2>'+
        '<div class="headers"><b>From</b> '+esc(m.from||'—')+'<br><b>Date</b> '+esc(m.date||'—')+
        (m.source?'<br><b>Source</b> '+esc(m.source):'')+'</div>'+
        '<div class="body">'+esc(m.body||'(no body)')+'</div>';
    }
    function apply(){ renderList(MM.search(mailbox, qEl.value)); }
    qEl.addEventListener('input', apply);

    // Render the SAMPLE immediately so the reader is usable even opened as a file:// (offline) — the
    // sample flag is showing, so this is never dressed as real mail (Real-or-Made).
    renderList(mailbox);

    // Then attempt the OWNER-DATA READ. The runtime serves the owner's content-bearing Soil at the
    // owner-gated GET /export/soil (the superset of the K1-stripped /projection/soil). On success we
    // swap the sample for the owner's real mail via the SAME model path the test exercises
    // (MM.mailboxFromExport). This runs on the box, where the owner session cookie is in hand; opened
    // as a bare file or with no session it 401s / fails and we KEEP the labelled sample. The live
    // path never shows the sample flag; the sample path never shows the live flag.
    var sampleFlag = document.getElementById('sampleFlag');
    var liveFlag = document.getElementById('liveFlag');
    function goLive(exportJson){
      mailbox = MM.mailboxFromExport(exportJson);   // filters to mail rows, newest-first
      activeId = null;
      sampleFlag.hidden = true; liveFlag.hidden = false;
      readerEl.innerHTML = '<p class="empty">Select a message to read it.</p>';
      renderList(MM.search(mailbox, qEl.value));     // honest empty-live if the Soil has no mail yet
    }
    if (typeof fetch === 'function' && location.protocol !== 'file:') {
      fetch('/export/soil', { credentials: 'same-origin', headers: { 'accept': 'application/json' } })
        .then(function(r){ return r.ok ? r.json() : null; })   // 401 (no owner session) / 404 -> null -> keep sample
        .then(function(json){ if (json) goLive(json); })
        .catch(function(){ /* offline / unreachable box -> keep the labelled sample, silently */ });
    }
  })();
  </script>
</body>
</html>
