<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Loop World — the shared delay-line mark, a bit alive in motion">
  <!-- ================================================================
       LOOP WORLD — MONOGRAM FAVICON  ·  the shared identity mark
       The favicon of the Loop World product surface. The MARK is the SHARED
       identity mark (brand-identity layer §B8) — the SAME locked loop+bit as
