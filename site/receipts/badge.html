<!doctype html>
<meta charset=utf-8><title>A Session's Integrity Badge — Receipts — Loop MMT</title>
<style>
.badge{--_known:var(--badge-known,#2f7d4f);--_due:var(--badge-known-due,#c98a1a);
  --_unreach-line:var(--badge-unreachable-line,#9aa0a6);
  --_unreach-ink:var(--badge-unreachable-ink,#6b7075);--_known-ink:var(--badge-known-ink,#fff);
  display:inline-block;font-family:var(--ink,ui-monospace,SFMono-Regular,Menlo,monospace);}
.badge__title{font-size:12px;letter-spacing:.12em;text-transform:lowercase;
  color:var(--moss,#5a6b5a);margin:0 0 6px 2px;}
.badge__grid{display:grid;grid-template-columns:repeat(3,26px);grid-template-rows:repeat(3,26px);
  gap:4px;}
.badge__cell{border-width:2px;border-radius:4px;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.badge__cell--verified{background:var(--_known);border-color:transparent;color:var(--_known-ink);}
.badge__cell--declared{background:var(--_due);border-color:transparent;color:var(--_known-ink);
  clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);
  -webkit-clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);}
.badge__cell--unreachable{background:transparent;border-style:dashed;
  border-color:var(--_unreach-line);color:var(--_unreach-ink);}
.badge__cell--heart{border-radius:50%;}
.badge__cell-label{font-size:8px;line-height:1;text-align:center;padding:1px;
  overflow:hidden;text-overflow:ellipsis;}
.badge__legend{font-size:9px;color:var(--moss,#5a6b5a);margin-top:6px;}
.badge__caveat{font-size:8px;color:var(--moss,#5a6b5a);opacity:.75;margin-top:2px;
  max-width:98px;line-height:1.25;}
</style>

" data-form="chip" data-mark="full" data-group="heart" role="img" aria-label="heart: verified — recomputed from byte-truth — the one recomputed substance check" style="background:var(--badge-known);border-style:solid;border-color:transparent;color:var(--badge-known-ink);"><span class="badge__cell-label">heart</span></div><div class="badge__cell badge__cell--unreachable badge__cell--ring" data-cell="kx" data-state="unreachable" data-form="ring" data-mark="ring" data-group="receipt" role="img" aria-label="KX: unreachable — the badge can't reach the truth" style="background:transparent;border-style:dashed;border-color:var(--badge-unreachable-line);color:var(--badge-unreachable-ink);"><span class="badge__cell-label">KX</span></div><div class="badge__cell badge__cell--verified badge__cell--chip" data-cell="confirm" data-state="verified" data-form="chip" data-mark="full" data-group="gate" role="img" aria-label="confirm: verified — recomputed from byte-truth — attests the artifact's presence, not that substantive work was done" style="background:var(--badge-known);border-style:solid;border-color:transparent;color:var(--badge-known-ink);"><span class="badge__cell-label">confirm</span></div><div class="badge__cell badge__cell--unreachable badge__cell--ring" data-cell="sx" data-state="unreachable" data-form="ring" data-mark="ring" data-group="receipt" role="img" aria-label="SX: unreachable — the badge can't reach the truth" style="background:transparent;border-style:dashed;border-color:var(--badge-unreachable-line);color:var(--badge-unreachable-ink);"><span class="badge__cell-label">SX</span></div><div class="badge__cell badge__cell--verified badge__cell--chip" data-cell="manifest" data-state="verified" data-form="chip" data-mark="full" data-group="gate" role="img" aria-label="manifest: verified — recomputed from byte-truth — attests the artifact's presence, not that substantive work was done" style="background:var(--badge-known);border-style:solid;border-color:transparent;color:var(--badge-known-ink);"><span class="badge__cell-label">manifest</span></div></div><div class="badge__legend">verified 5 · declared 0 · unreachable 4</div><div class="badge__caveat">attests artifact presence · the heart is the one recomputed substance check</div></div>
