<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" role="img"
     aria-label="Loop MMT">
  <!-- LOOP MMT — clean primary lockup: the delay-line loop carrying 0,
       shown by its one signal bit, with the wordmark. One clean treatment. -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340&amp;display=swap');
      .word { font-family:'Fraunces',Georgia,'Times New Roman',serif; fill:#221d16; }
      .loop { fill:none; stroke:#221d16; }
      .bit  { fill:#bf4a20; }
    </style>
  </defs>
  <g transform="translate(6,0)">
    <!-- the mark: stadium delay-line loop + one bit riding the top run -->
    <rect class="loop" x="0" y="22" width="112" height="54" rx="27" ry="27" stroke-width="12.35"/>
    <circle class="bit" cx="78" cy="22" r="13.31"/>
    <!-- wordmark: "Loop MMT" as one unified logotype (Fraunces) -->
    <text class="word" x="150" y="67" font-size="66" font-weight="340" letter-spacing="-0.5">Loop MMT</text>
  </g>
</svg>
