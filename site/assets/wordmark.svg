<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img"
     aria-label="Loop MMT — a mercury delay-line loop carrying its least information (0), shown by its one signal bit (1): using 1 to show 0, the whole binary range alive on the Loop">
  <!-- ================================================================
       LOOP MMT — WORDMARK v1  ·  the design act of's brand layer (Δ2)
       The identity is NOT a skin. The Forest is a skin.
       Only three tokens below carry the skin; the GEOMETRY is skin-independent
       — re-skin = swap the id-accent/id-ink/id-ground tokens, same mark.
       Canonical faces: Fraunces (wordmark) · Spline Sans Mono (MMT designation).
       The mark: a delay-line loop (the mercury circuit Loop 1.0 was born from),
       one gold bit alive in motion — Higgins-clean (one colour, any scale).
       THE SYMBOLOGY (operator, S12.11xx): the mark is the Loop carrying its LEAST
       information — 0 — and in the Loop 2.1 world that 0 is signified through its one
       signal bit. So the filled bit (a present bit = a 1) is showing the value 0:
       using 1 to show 0 — the whole binary range (0 and 1) running on the one Loop.
       That is the mark's meaning, not decoration. Bit + loop = ONE discrete unit;
       bold/scale them together, never apart.
       ================================================================ -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,500&amp;family=Spline+Sans+Mono:wght@500&amp;display=swap');
      :root{
        --id-ink:    #1C2A24;   /* --shadow  · ink                          */
        --id-accent: #C9A84C;   /* --sunlight· the ONE lit signal — THE BIT */
        --id-loop:   #55636F;   /* the loop = STRUCTURE, stepped back (skin) */
        --id-ground: #FFFDF8;   /* --paper   · ground                       */
        --id-quiet:  #6B4E37;   /* --bark    · the designation, stepped back */
      }
      .word  { font-family:'Fraunces',Georgia,'Times New Roman',serif; fill:var(--id-ink); }
      .desig { font-family:'Spline Sans Mono',ui-monospace,Menlo,monospace; fill:var(--id-quiet); }
      .loop  { fill:none; stroke:var(--id-loop); }
      .bit   { fill:var(--id-accent); }
      .rule  { stroke:var(--id-accent); opacity:.34; }
      .cap   { font-family:'Spline Sans Mono',ui-monospace,monospace; fill:var(--id-quiet); opacity:.62; }
    </style>
  </defs>

  <rect width="760" height="460" fill="var(--id-ground)"/>

  <!-- ============ PRIMARY LOCKUP · mark + wordmark ============ -->
  <g transform="translate(64,116)">
    <!-- the mark: a horizontal delay-line loop, one bit riding the top run toward
         the leading (right) cap — the bit is "alive only in motion" (Loop 1.0). -->
    <g>
      <!-- stadium loop: two semicircle caps (r=27) + straight runs -->
      <rect class="loop" x="2" y="2" width="112" height="54" rx="27" ry="27" stroke-width="12.35"/>
      <!-- the bit: one gold disc on the top run, offset right = circulation -->
      <circle class="bit" cx="80" cy="2" r="13.31"/>
    </g>

    <!-- wordmark: "Loop MMT" as ONE unified logotype — single face (Fraunces), single
         size, set together (operator directive S11.21xx — the stepped-back small mono
         "MMT" designation was retired; the lockup reads as one word now). -->
    <text class="word" x="150" y="47" font-size="66" font-weight="340"
          letter-spacing="-0.5">Loop MMT</text>
  </g>

  <!-- a hairline optical rule (not a border) — the same line-gold hairline discipline the app uses -->
  <line class="rule" x1="64" y1="212" x2="696" y2="212" stroke-width="1"/>
  <text class="cap" x="64" y="236" font-size="12" letter-spacing="2.5">THE DELAY-LINE LOOP CARRYING 0 — SHOWN BY ITS ONE SIGNAL BIT (A 1)</text>

  <!-- ============ THE MONOGRAM · the mark alone, Higgins proof at scale ============ -->
  <g transform="translate(64,300)">
    <text class="cap" x="0" y="-8" font-size="12" letter-spacing="2.5">MONOGRAM — WORKS IN ONE COLOUR, ANY SCALE (favicon → signage)</text>

    <!-- large -->
    <g transform="translate(0,18)">
      <rect class="loop" x="0" y="0" width="96" height="46" rx="23" ry="23" stroke-width="5"/>
      <circle class="bit" cx="72" cy="0" r="7.5"/>
    </g>
    <!-- medium -->
    <g transform="translate(150,30)">
      <rect class="loop" x="0" y="0" width="60" height="29" rx="14.5" ry="14.5" stroke-width="3.4"/>
      <circle class="bit" cx="45" cy="0" r="5"/>
    </g>
    <!-- small (favicon) -->
    <g transform="translate(250,38)">
      <rect class="loop" x="0" y="0" width="34" height="17" rx="8.5" ry="8.5" stroke-width="2.2"/>
      <circle class="bit" cx="25.5" cy="0" r="3"/>
    </g>
    <!-- reversed chip (the mark holds on ink, too — for dark skins / the app corner) -->
    <g transform="translate(330,10)">
      <rect x="0" y="0" width="96" height="64" rx="12" fill="var(--id-ink)"/>
      <g transform="translate(24,30)">
        <rect class="loop" x="0" y="0" width="48" height="24" rx="12" ry="12" stroke-width="3"/>
        <circle class="bit" cx="36" cy="0" r="4"/>
      </g>
    </g>
    <text class="cap" x="460" y="46" font-size="11" letter-spacing="1.5">↑ one glyph, one meaning (Nyx/JT-2): the loop circulates. no second job.</text>
  </g>

  <!-- ============ SKIN-INDEPENDENCE note ============ -->
  <text class="cap" x="64" y="430" font-size="12" letter-spacing="2">IDENTITY ≠ SKIN · re-skin swaps --id-accent/--id-ink/--id-ground · geometry unchanged · Forest = default skin</text>
</svg>
