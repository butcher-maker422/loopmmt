<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loop MMT mark">
  <!-- The favicon/app-icon mark: a delay-line loop carrying 0, shown by its one
       signal bit. Split-colour per operator (S09.0053): the loop is STRUCTURE
       (ink, stepped back), the bit is the one lit signal (persimmon) — the Loop
       World pattern in the site's own scheme. On a paper chip so the ink loop
       reads on light AND dark tab bars (the Forest favicon does the same). -->
  <rect width="64" height="64" rx="14" fill="#f7f2e8"/>
  <rect class="loop" x="8" y="24" width="48" height="24" rx="12" ry="12"
        fill="none" stroke="#221d16" stroke-width="6"/>
  <circle cx="44" cy="24" r="6.5" fill="#bf4a20"/>
</svg>
